# ============================================================
#  DockerX  ·  settings.conf  (cross-platform)
#  Yahan se apni settings badal sakte ho (owner.conf MAT chhedna).
# ============================================================

# Linux rootfs jo behind-the-scenes use hoga
DX_DISTRO=ubuntu

# Prompt style: docker (@docker~#) | alexa | minimal | power | plain
DX_PROMPT_STYLE=docker

# Launcher command ka naam
DX_LAUNCHER=dockerx

# Default docker data dir (rootfs ke andar)
DX_DOCKER_DATA=/var/lib/docker
