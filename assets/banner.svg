<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="DockerX banner">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e23744"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- transparent background: no bg rect -->

  <!-- Whale (Docker-style) -->
  <g transform="translate(120,120)">
    <g fill="url(#cyan)" opacity="0.95">
      <rect x="18" y="34" width="26" height="24" rx="3"/>
      <rect x="50" y="34" width="26" height="24" rx="3"/>
      <rect x="82" y="34" width="26" height="24" rx="3"/>
      <rect x="50" y="4"  width="26" height="24" rx="3"/>
      <rect x="82" y="4"  width="26" height="24" rx="3"/>
      <rect x="114" y="34" width="26" height="24" rx="3"/>
    </g>
    <path d="M0 74 q60 -26 150 0 q30 6 42 22 q-16 10 -40 12 q-80 8 -152 -6 q-14 -4 -14 -14 q0 -10 14 -14 z" fill="#94a3b8"/>
    <path d="M-2 84 q-34 -22 -60 -14 q10 22 34 30 q-24 8 -34 30 q26 8 60 -14 z" fill="#94a3b8"/>
    <circle cx="34" cy="80" r="5" fill="#0f172a"/>
    <path d="M20 74 q-6 -26 -22 -34 M20 74 q2 -28 -6 -40 M20 74 q10 -24 22 -30"
          stroke="url(#cyan)" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <text x="420" y="150" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" fill="#64748b">Docker<tspan fill="url(#accent)">X</tspan></text>

  <text x="424" y="202" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="url(#cyan)">One command. No root. No unlock.</text>

  <text x="424" y="250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="24" fill="#94a3b8">Android (Termux) · Linux · Windows (WSL) · macOS</text>

  <text x="424" y="302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#64748b">Owner: Hari Jadhav Ji</text>
  <text x="704" y="302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700" fill="url(#accent)">· Built by Alexa</text>
</svg>
